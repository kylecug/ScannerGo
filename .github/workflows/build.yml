name: Build IPA

# push 到 main      → 编译并覆盖 "latest" 预览版
# push v* 标签       → 编译带版本号的 IPA，发布正式版 vX.Y.Z
#                      （kylecug/ipa-release 每小时会把正式版搬过去并更新 LiveContainer 源）
# 手动运行            → 填了版本号就发正式版 v<版本号>（自动打 tag），不填就同 main
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本号，例如 1.1.0（留空 = 只更新 latest 预览版）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang + lld
        run: sudo apt-get update && sudo apt-get install -y clang lld zip

      - name: Cache iOS SDK
        uses: actions/cache@v4
        with:
          path: .sdk
          key: ios-sdk-16.5

      - name: Work out version
        id: ver
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="${INPUT_VERSION#v}"
          fi
          if [ -n "$v" ] && ! [[ "$v" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "版本号格式不对: $v（要类似 1.2.0）"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=${v:+v$v}" >> "$GITHUB_OUTPUT"
          echo "版本: ${v:-（预览版）}"

      - name: Build
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: ./build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: scannerGo-ipa
          path: scannerGo.ipa

      - name: Publish "latest" pre-release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.ver.outputs.tag == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest scannerGo.ipa \
            --title "scannerGo (latest)" \
            --notes "自动构建自 ${GITHUB_SHA::7}，开发预览版。正式版请看带版本号的 release。" \
            --prerelease --target "$GITHUB_SHA"

      - name: Publish versioned release
        if: steps.ver.outputs.tag != '' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          cp scannerGo.ipa "scannerGo-${TAG}.ipa"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "scannerGo-${TAG}.ipa" --clobber
          else
            # tag 不存在时 gh 会在当前 commit 上自动打 tag
            gh release create "$TAG" "scannerGo-${TAG}.ipa" --target "$GITHUB_SHA" \
              --title "scannerGo ${TAG}" --generate-notes --latest
          fi

